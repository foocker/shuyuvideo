      (()=>{
        'use strict';
        const art=document.getElementById('intro-art');
        const vars=window.__hyperframes&&window.__hyperframes.getVariables?window.__hyperframes.getVariables():{};
        const defaults={background:'#F4F2EC',ink:'#203B35',accent:'#548D80'};
        for(const key of Object.keys(defaults))art.style.setProperty('--brand-'+key,String(vars[key]||defaults[key]));

        name.textContent=vars.brandName==null?'数语':String(vars.brandName);
        const trace=document.getElementById('intro-omega-trace');
        const fill=document.getElementById('intro-omega-fill');
        const eyes=[document.getElementById('intro-eye-L'),document.getElementById('intro-eye-R')];
        const length=trace.getTotalLength();
        // The gap is twice the path, so at the start offset the only dash lies wholly
        // before the path: nothing is painted, not even a round cap, until the draw begins.
        trace.style.strokeDasharray=length+' '+2*length;
        const tl=gsap.timeline({paused:true});

        tl.fromTo(eyes,{scaleY:.025,svgOrigin:'0 30',opacity:0},{scaleY:1,opacity:1,duration:.35,ease:'power2.out'},1.12);

        tl.to(eyes,{scaleY:.025,duration:.09,ease:'sine.in'},1.91);
        tl.to(eyes,{scaleY:1,duration:.19,ease:'sine.out'},2.06);

tl.fromTo('#full-and',{opacity:0},{opacity:1,duration:.28,ease:'sine.out'},3.92);
tl.fromTo('#full-imagine',{opacity:0},{opacity:1,duration:.25,ease:'sine.out'},4.04);

tl.fromTo('#full-boundary-b',{x:11},{x:0,duration:.48,ease:'power2.out'},4.36);

tl.addLabel('brand-and-tagline',4.84);
