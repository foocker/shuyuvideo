<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数语 Ω · 角色动作库</title>
<style>
@font-face{font-family:Shuyu;src:url('assets/fonts/ui.woff2')}@font-face{font-family:Shuyu;src:url('assets/fonts/ui-bold.woff2');font-weight:700}
*{box-sizing:border-box}body{margin:0;background:#eaeae2;color:#141413;font-family:Shuyu,system-ui,sans-serif}button,select,input{font:inherit}button,select{cursor:pointer}header{max-width:1640px;margin:auto;padding:29px 36px 24px;display:flex;align-items:center;gap:20px;border-bottom:1px solid #cccac1}header .brand{font-family:Georgia,serif;font-size:40px;line-height:1}h1{font-size:23px;font-weight:700;margin:0}header p{font-size:13px;margin:6px 0 0;color:#68685f}header a{margin-left:auto;color:#55564d;font-size:13px;text-underline-offset:4px}main{max-width:1640px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;padding:28px 36px 36px}.stage-wrap{min-width:0}.stage{height:min(65vh,690px);min-height:400px;background:#f6f5ef;border:1px solid #d4d2c8;position:relative;overflow:hidden}.stage.checker{background-color:#f6f5ef;background-image:linear-gradient(45deg,#deded6 25%,transparent 25%),linear-gradient(-45deg,#deded6 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#deded6 75%),linear-gradient(-45deg,transparent 75%,#deded6 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}#actor{width:100%;height:100%}.stage-name{position:absolute;left:24px;top:22px;font-size:13px;letter-spacing:1px;color:#68685f;pointer-events:none}.transport{display:flex;align-items:center;gap:14px;margin:19px 0}.transport input{flex:1;min-width:80px;accent-color:#cc5a36}.button{background:#f6f5ef;border:1px solid #c7c6ba;border-radius:4px;padding:9px 13px;color:#141413}.button:hover{border-color:#cc5a36}.primary{background:#141413;color:#fffdf6;border-color:#141413}.time{font-size:12px;font-variant-numeric:tabular-nums;min-width:83px;text-align:right}.exports{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.exports label{font-size:12px;margin-right:auto;display:flex;align-items:center;gap:7px;color:#55564d}.exports button{font-size:12px}.note{color:#74746a;font-size:12px;line-height:1.8;margin:16px 0 0}.controls section{margin:0 0 23px}.controls h2{font-size:14px;margin:0 0 12px;display:flex;align-items:center;gap:10px}.controls h2 small{font-weight:400;font-size:11px;color:#74746a}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button{background:transparent;border:1px solid #c7c6ba;color:#484b41;text-align:left;font-size:13px;padding:10px 12px;border-radius:4px}.actions button[aria-pressed=true]{background:#141413;border-color:#141413;color:#fffdf6}.actions button:hover{border-color:#cc5a36}.controls select{background:#f6f5ef;border:1px solid #c7c6ba;border-radius:4px;width:100%;padding:9px;color:#141413;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row label{display:block;font-size:12px;color:#68685f;margin-bottom:7px}.palette{display:flex;gap:10px}.swatch{width:38px;height:38px;border:3px solid transparent;border-radius:50%;background:var(--color);box-shadow:inset 0 0 0 2px #eaeae2}.swatch[aria-pressed=true]{border-color:#cc5a36}.gaze{display:flex;align-items:center;gap:10px;font-size:12px}.gaze button{width:34px;height:31px;padding:0;font-size:16px}.gaze label{margin-left:auto;display:flex;gap:5px;align-items:center}.controls input[type=checkbox]{accent-color:#cc5a36}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #cc5a36;outline-offset:3px}#status{min-height:22px;font-size:12px;color:#76766a;margin-top:10px}
@media(max-width:960px){main{grid-template-columns:1fr;padding:18px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:20px}.controls section:first-child{grid-column:1/-1}.actions{grid-template-columns:repeat(3,1fr)}header{padding:20px}.stage{height:60vh;min-height:330px}}@media(max-width:540px){.controls{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.transport{gap:8px}.button{padding:8px 10px}header p{font-size:11px}header a{display:none}}
</style></head><body>
<header><div class="brand" aria-hidden="true">Ω</div><div><h1>数语 · 角色动作库</h1><p>一个符号，也有自己的眼神和小动作。</p></div><a href="README.md">使用与接入说明</a></header>
<main><div class="stage-wrap"><div class="stage" id="stage"><div class="stage-name" id="stage-name">挥手招呼</div><div id="actor"></div></div>
<div class="transport"><button class="button primary" id="play">暂停</button><button class="button" id="restart" title="从头播放">重播</button><input id="seek" type="range" min="0" max="3.6" step="0.001" value="0" aria-label="动作进度"><span class="time" id="time">0.00 / 3.60</span><select id="speed" class="button" aria-label="播放速度"><option value=".5">半速</option><option value="1" selected>原速</option><option value="1.5">1.5 倍</option></select></div>
<div class="exports"><label><input type="checkbox" id="checker">透明背景预览</label><button class="button" id="save-svg">导出当前 SVG</button><button class="button" id="save-png">导出透明 PNG</button></div><div id="status" aria-live="polite"></div><p class="note">可以单独选择表情、视线和手势，再拖动时间查看。导出的角色自带透明背景，可直接放进后续视频。</p></div>
<aside class="controls"><section><h2>动作 <small>15 个基础动作</small></h2><div class="actions" id="actions"></div></section>
<section><div class="row"><div><label for="expression">表情</label><select id="expression"><option value="auto">跟随动作</option></select></div><div><label for="cycle">播放方式</label><select id="cycle"><option value="repeat">循环预览</option><option value="once">播放一次</option></select></div></div></section>
<section><h2>目光</h2><div class="gaze"><button class="button" data-look="-1,0" aria-label="看左边">←</button><button class="button" data-look="0,-1" aria-label="看上方">↑</button><button class="button" data-look="1,0" aria-label="看右边">→</button><button class="button" id="gaze-auto" aria-label="恢复自动目光">↺</button><label><input type="checkbox" id="follow">跟随鼠标</label></div></section>
<section><div class="row"><div><label for="hand-left">左侧手（画面左）</label><select id="hand-left"></select></div><div><label for="hand-right">右侧手（画面右）</label><select id="hand-right"></select></div></div></section>
<section><h2>角色配色</h2><div class="palette" id="palettes"></div></section>
</aside></main>
<script src="lib/omega-shape.js"></script><script src="lib/omega.js"></script><script src="lib/playground.js"></script>
</body></html>
