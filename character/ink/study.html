<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨影 · 动作库</title><style>
:root{--stage:#f4f0e7;--ink:#263640;--muted:#778186;--accent:#ba6d36}*{box-sizing:border-box}body{margin:0;background:#ebe7df;color:var(--ink);font:15px/1.6 system-ui,sans-serif}header,main{max-width:1440px;margin:auto;padding:26px 30px}header{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:18px}h1{margin:0;font-size:30px}header span{color:#6b777a}button,select,input{font:inherit}button,select{border:1px solid #c9c6bd;border-radius:6px;background:#f8f5ef;color:inherit;padding:8px 13px;cursor:pointer}button.active{border-color:var(--ink);background:var(--ink);color:#fff7eb}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #bc6e32;outline-offset:3px}main{padding-top:0}.catalog{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}.stages{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:var(--stage);border:1px solid #cbc8bf;border-radius:10px;overflow:hidden}.panel-title{padding:11px 17px;display:flex;justify-content:space-between;border-bottom:1px solid #c9c5bb;color:#7f8a8e;font-size:14px}.panel-title b{color:#8b9699}.viewport{aspect-ratio:16/11;position:relative;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}.floor,.rail{stroke:#a6aaa6;stroke-width:1}.prop{fill:var(--stage);stroke:#bb7a43;stroke-width:2}.info{margin:22px 0 12px;display:flex;gap:24px;justify-content:space-between;align-items:center}h2{margin:0;font-size:25px}.info p{margin:0;color:#6b767c}#seek{width:100%;accent-color:#344750}.controls{display:flex;align-items:center;gap:13px;flex-wrap:wrap;padding:15px 0}.controls label{display:flex;align-items:center;gap:6px}#time{font-variant-numeric:tabular-nums;min-width:115px}.exports{margin-left:auto;display:flex;gap:8px}input[type=color]{width:34px;height:30px;padding:0;border:0}.hint{border-top:1px solid #cac6bc;padding-top:18px;color:#737d80;font-size:13px}a{color:#875c3b}@media(max-width:850px){header{display:block;padding:20px}main{padding:0 20px 25px}.stages{grid-template-columns:1fr}.info{display:block}.exports{margin-left:0}h1{font-size:26px}}
[hidden]{display:none!important}.filter{display:flex;align-items:center;gap:12px;margin:0 0 14px}#breakdown>svg{position:absolute;inset:0}.beat-labels{position:absolute;top:75%;left:0;width:100%;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;color:#7a8586}.panel-title b{color:#53686e}</style></head><body><header><h1>墨影 · 动作库</h1><span>置换之梦 / 30 个动作 / v3</span></header><main><label class="filter">动作分类 <select id="category"><option value="all">全部 30 个动作</option></select></label><nav id="catalog" class="catalog" aria-label="动作列表"></nav><div class="stages"><section class="panel"><div class="panel-title"><b>墨影</b><span>实心头 · 笔锋 · 目光</span></div><div class="viewport"><svg class="layer" viewBox="0 0 640 440"><g id="ink-guide"></g><line id="ink-floor" class="floor" x1="40" y1="365" x2="600" y2="365"/><line id="ink-rail" class="rail" x1="240" x2="400"/></svg><div id="actor" class="layer"></div><svg class="layer" viewBox="0 0 640 440"><circle id="ink-point" class="prop" r="5"/></svg></div></section><section class="panel"><div class="panel-title"><b id="ref-title">火柴人</b><span id="ref-subtitle">同动作 · 同时钟</span></div><div class="viewport"><svg id="ref-fixtures" class="layer" viewBox="0 0 640 440"><line id="ref-floor" class="floor" x1="40" y1="365" x2="600" y2="365"/><line id="ref-rail" class="rail" x1="240" x2="400"/></svg><div id="reference" class="layer"></div><div id="breakdown" class="layer" hidden><div class="beat-labels"><span>准备</span><span>动作</span><span>收势</span></div></div><svg id="ref-overlay" class="layer" viewBox="0 0 640 440"><circle id="ref-point" class="prop" r="5"/></svg></div></section></div><div class="info"><h2 id="label"></h2><p id="description"></p></div><input id="seek" type="range" min="0" max="2.4" step=".001" value="0" aria-label="动作时间"><div class="controls"><button id="play">播放</button><button id="restart">重播</button><span id="time"></span><label>速度<select id="rate"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label><label><input type="checkbox" id="mirror">镜像</label><label><input type="checkbox" id="skeleton">关节</label><label><input type="checkbox" id="travel">行进</label><label><input type="checkbox" id="props" checked>道具</label><label>底色<select id="background"><option value="light">纸白</option><option value="dark">深色</option><option value="teal">青色</option></select></label><label>墨色<input type="color" id="color" value="#263640"></label><div class="exports"><button id="svg-export">导出 SVG</button><button id="png-export">导出 PNG</button></div></div><p class="hint">拖动时间轴逐姿态查看。导出透明 SVG / PNG，可切换是否包含道具。基础动作保留火柴人对照，新增动作显示三个关键姿态。单次动作停在末态。<a href="README.md">接入说明</a> · <a href="SOURCES.md">来源说明</a></p></main><script src="lib/motions.js"></script><script src="lib/ink.js"></script><script src="reference/motions.js"></script><script src="reference/stickman.js"></script><script src="lib/catalog.js"></script><script src="lib/guides.js"></script><script src="lib/player.js"></script></body></html>
